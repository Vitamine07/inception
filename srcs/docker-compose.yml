version: '3'

services:
  mariadb:
    build: ./requirements/mariadb
    image: mariadb
    container_name: mariadb
    restart: always
    env_file: .env
    networks:
      - inception_network
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "--silent", "-P", "3306"]
      interval: 5s
      retries: 5

  wordpress:
    build: ./requirements/wordpress
    image: wordpress
    container_name: wordpress
    restart: always
    env_file: .env
    networks:
      - inception_network
    volumes:
      - wordpress_files:/var/www/html
    depends_on:
      - mariadb
    healthcheck:
      test: ["CMD", "test", "-f", "/var/www/html/index.php"]
      interval: 5s
      retries: 10

  nginx:
    build: ./requirements/nginx
    image: nginx
    container_name: nginx
    restart: always
    env_file: .env
    ports:
      - "443:443"
    networks:
      - inception_network
    volumes:
      - wordpress_files:/var/www/html

volumes:
  mariadb_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/mbenzira/data/mariadb

  wordpress_files:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/mbenzira/data/wordpress

networks:
  inception_network:
    driver: bridge
